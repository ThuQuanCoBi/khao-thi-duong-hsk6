<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>HSK6 3.0</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--c:#fff;--b:#ddd;--ac:#b3402a;--mu:#777}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b1d;--fg:#eee;--c:#26262a;--b:#3a3a40;--ac:#e8785f;--mu:#999}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"PingFang SC","Noto Sans SC",sans-serif}
nav{display:flex;gap:4px;padding:8px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--b);z-index:5}nav button{flex:1}
button,select,input,textarea{font:inherit;color:inherit;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:12px}.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:10px 0}
.zh{font-size:19px;line-height:2.2}.mu{color:var(--mu);font-size:14px}.ok{color:#2a8a4a}.no{color:#c0392b}
.chip{display:inline-block;border:1px solid var(--b);border-radius:14px;padding:0 10px;margin:2px;cursor:pointer}textarea{width:100%}.dots{letter-spacing:2px;color:var(--ac)}
</style></head><body>
<nav><button data-t=home>Tổng quan</button><button data-t=read>Luyện đọc</button><button data-t=notes>Sổ tay</button><button data-t=mock>Thi thử</button></nav>
<main id=m>Đang tải…</main>
<script>
const $=s=>document.querySelector(s),M=$('#m'),DAY=864e5,IV=[1,2,4,7,14];
let V=[],E=[],S,T;
try{S=JSON.parse(localStorage.getItem('hsk6'))}catch(e){}S=S||{n:[],h:[]};
const sv=()=>{try{localStorage.setItem('hsk6',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const due=()=>S.n.filter(n=>n.due<=Date.now()),L6='ABCDEF';
const toast=m=>{const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 14px;border-radius:20px;z-index:9';document.body.append(d);setTimeout(()=>d.remove(),1400)};
(async()=>{try{V=await(await fetch('data/vocab.json')).json();E=(await(await fetch('data/exams.json')).json()).exams}catch(e){M.textContent='Không tải được dữ liệu. Hãy mở qua đường link GitHub Pages (không mở file trực tiếp).';return}go('home')})();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){document.onselectionchange=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));clearInterval(T);({home,read,notes,mock})[t]()}
function add(w,ctx,src){if(S.n.some(n=>n.w==w)){toast('Đã có trong sổ tay');return}const v=V.find(x=>x.w==w)||{};
const sen=(ctx||'').split(/(?<=[。！？])/).find(x=>x.includes(w))||'';
S.n.push({w,py:v.py||'',vi:v.vi||'',coll:v.coll||'',conf:v.conf||'',ex:v.ex||'',ctx:sen,src:src||'',lv:0,due:Date.now()});sv();toast('Đã thêm “'+w+'”')}

function home(){const d=S.exam?Math.ceil((new Date(S.exam)-Date.now())/DAY):null;
M.innerHTML=`<div class=card><b>Ngày thi</b> <input type=date id=ed value="${S.exam||''}"> ${d!=null?`<b>còn ${d} ngày</b>`:''}</div>
<div class=card>📒 Sổ tay: <b>${S.n.length}</b> từ · cần ôn hôm nay: <b>${due().length}</b> · Kho từ: ${V.length}</div>
<div class=card><b>Lịch sử thi thử</b>${S.h.slice(-8).reverse().map(h=>`<div>${new Date(h.t).toLocaleDateString()} · ${esc(h.e)} · ${h.s}: ${h.c}/${h.k} → <b class="${h.p<60?'no':'ok'}">${h.p}/100</b></div>`).join('')||'<div class=mu>Chưa có.</div>'}</div>
<div class=card><button id=ex>Xuất sao lưu</button> <label class=mu>Nhập: <input type=file id=im accept=.json></label><div class=mu>Dữ liệu lưu riêng trên từng thiết bị. Cuối buổi học hãy xuất file rồi nhập vào thiết bị còn lại (nhập sẽ thay thế dữ liệu hiện có).</div></div>`;
$('#ed').onchange=e=>{S.exam=e.target.value;sv();home()};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='hsk6-backup.json';a.click()};
$('#im').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.n))throw 0;S=j;sv();home()}catch(x){alert('File không hợp lệ')}}}

function read(){const L=E.flatMap(e=>e.sets.map(s=>({...s,e:e.name})));
M.innerHTML=L.map((s,i)=>`<div class=card><b>${esc(s.e)}</b> · ${esc(s.title)} <button data-i=${i}>Làm</button></div>`).join('')||'Chưa có bài.';
M.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>doSet(L[b.dataset.i]))}
function doSet(s){const full=s.text.replace(/\{(\d+)\}/g,(m,n)=>{const q=s.qs.find(q=>q.n==n);return q.o[q.a]});
const sel=q=>`<select data-n=${q.n}><option value=-1>${q.n}</option>${q.o.map((o,j)=>`<option value=${j}>${L6[j]}. ${esc(o)}</option>`).join('')}</select>`;
const html=esc(s.text).replace(/\{(\d+)\}/g,(m,n)=>sel(s.qs.find(q=>q.n==n)));
const rest=s.qs.filter(q=>!s.text.includes('{'+q.n+'}')).map(q=>`<div class=card>${q.n}. ${esc(q.p||'')} ${sel(q)}</div>`).join('');
M.innerHTML=`<button id=bk>← Danh sách</button><div class="card zh" id=ps>${html}</div>${rest}<button id=sb class=p style="display:none;position:sticky;bottom:8px"></button> <button id=sm class=p>Nộp bài</button><div id=rs></div>`;
$('#bk').onclick=read;
document.onselectionchange=()=>{const g=getSelection(),t=g.toString().trim(),b=$('#sb');if(b&&t&&t.length<=12&&g.anchorNode&&$('#ps').contains(g.anchorNode)){b.style.display='';b.textContent='＋ Thêm “'+t+'” vào sổ tay';b.onclick=()=>add(t,full,s.title)}};
$('#sm').onclick=()=>{let c=0,h='';s.qs.forEach(q=>{const el=M.querySelector(`select[data-n="${q.n}"]`),ok=+el.value==q.a;c+=ok;el.style.outline='2px solid '+(ok?'#2a8a4a':'#c0392b');
h+=`<div class=card><b class=${ok?'ok':'no'}>${q.n}. ${ok?'✓':'✗ đáp án '+L6[q.a]}</b> ${esc(q.why||'')}<div>${q.o.filter(o=>o.length<=6).map(o=>`<span class=chip data-w="${esc(o)}">＋${esc(o)}</span>`).join('')}</div></div>`});
$('#rs').innerHTML=`<h3>${c}/${s.qs.length}</h3><div class=mu>Chạm vào từ bên dưới để thêm vào sổ tay.</div>`+h;
$('#rs').querySelectorAll('.chip').forEach(x=>x.onclick=()=>{add(x.dataset.w,full,s.title);x.style.opacity=.4})}}

function notes(){
M.innerHTML=`<div class=card><input id=q placeholder="Tìm trong kho từ (chữ / pinyin / nghĩa) để thêm" style="width:100%"><div id=sr></div></div>
<div class=card><button class=p id=r1>Ôn hôm nay (${due().length})</button> <button id=r2>Ôn dạng điền trống</button></div><div id=ls></div>`;
$('#q').oninput=e=>{const t=e.target.value.trim().toLowerCase();$('#sr').innerHTML=t?V.filter(x=>x.w.includes(t)||x.py.toLowerCase().includes(t)||x.vi.toLowerCase().includes(t)).slice(0,8).map(x=>`<div><span class=chip data-w="${esc(x.w)}">＋${esc(x.w)}</span> <span class=mu>${esc(x.py)} · ${esc(x.vi)}</span></div>`).join(''):'';
$('#sr').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{add(c.dataset.w);notes()})};
$('#r1').onclick=()=>review(1);$('#r2').onclick=()=>review(2);
$('#ls').innerHTML=S.n.map((n,i)=>`<div class=card><span class=zh><b>${esc(n.w)}</b></span> ${esc(n.py)} <span class=dots>${'●'.repeat(n.lv)}${'○'.repeat(5-n.lv)}</span> <button data-d=${i}>✕</button><div>${esc(n.vi)}</div>${[['coll','Hay đi với'],['conf','Dễ nhầm với'],['ex','Ví dụ']].map(([k,l])=>`<div class=mu>${l}</div><textarea rows=1 data-i=${i} data-k=${k}>${esc(n[k])}</textarea>`).join('')}<div class=mu>${esc(n.ctx)} ${n.src?'· '+esc(n.src):''}</div></div>`).reverse().join('')||'<div class=mu>Sổ tay trống — làm bài đọc và bôi đen từ chưa biết.</div>';
$('#ls').querySelectorAll('textarea').forEach(t=>t.onchange=()=>{S.n[t.dataset.i][t.dataset.k]=t.value;sv()});
$('#ls').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Xoá từ này?')){S.n.splice(b.dataset.d,1);sv();notes()}})}

function review(mode){const Q=due().sort(()=>Math.random()-.5);let i=0;const rnd=a=>a.sort(()=>Math.random()-.5);
const gr=(n,g)=>{n.lv=g==2?Math.min(n.lv+1,5):g==1?n.lv:0;n.due=Date.now()+(n.lv?IV[n.lv-1]*DAY:.02*DAY);sv();i++;nx()};
function nx(){if(i>=Q.length){M.innerHTML='<div class=card>Xong! <button id=b>Về sổ tay</button></div>';$('#b').onclick=notes;return}
const n=Q[i];
if(mode==2&&n.ctx&&n.ctx.includes(n.w)){const o=rnd([n.w,...rnd(S.n.filter(x=>x.w!=n.w)).slice(0,3).map(x=>x.w)]);
M.innerHTML=`<div class="card zh">${esc(n.ctx.replace(n.w,'＿＿'))}</div>`+o.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button> `).join('')+'<div id=fb></div>';
M.querySelectorAll('button[data-w]').forEach(b=>b.onclick=()=>{const ok=b.dataset.w==n.w;$('#fb').innerHTML=`<div class=card><b class=${ok?'ok':'no'}>${ok?'Đúng':'Sai — đáp án: '+esc(n.w)}</b> ${esc(n.py)} ${esc(n.vi)}<div>Hay đi với: ${esc(n.coll)}</div><button id=nx class=p>Tiếp</button></div>`;$('#nx').onclick=()=>gr(n,ok?2:0)})}
else{M.innerHTML=`<div class="card zh" style="text-align:center"><b style="font-size:32px">${esc(n.w)}</b><div class=mu>Nhớ nghĩa và các từ hay đi cùng, rồi bấm xem</div><button id=sh>Xem</button><div id=an style="display:none;text-align:left;font-size:16px">${esc(n.py)} · ${esc(n.vi)}<div>Hay đi với: ${esc(n.coll)}</div><div>Dễ nhầm: ${esc(n.conf)}</div><div class=mu>${esc(n.ctx)}</div></div></div><div id=gb style="display:none"><button data-g=0>Quên</button> <button data-g=1>Mờ</button> <button data-g=2 class=p>Nhớ</button></div>`;
$('#sh').onclick=()=>{$('#an').style.display=$('#gb').style.display=''};M.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>gr(n,+b.dataset.g))}}
Q.length?nx():(M.innerHTML='<div class=card>Hôm nay không có từ cần ôn 🎉</div>')}

const SEC={L:{n:1,m:30,l:'Nghe'},R:{n:41,m:40,l:'Đọc'},W:{m:45,l:'Viết'}};
function mock(){M.innerHTML=`<div class=card>Đề: <select id=me>${E.map((e,i)=>`<option value=${i}>${esc(e.name)}</option>`).join('')}</select><div style="margin:8px 0">${Object.keys(SEC).map(k=>`<button data-k=${k}>${SEC[k].l} (${SEC[k].m}’)</button>`).join(' ')}</div><div class=mu>Điểm là ước tính theo tỉ lệ đúng; cách quy đổi chính thức chưa được công bố. Mỗi phần cần ≥60.</div></div>`;
M.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>run(E[$('#me').value],b.dataset.k))}
function run(e,k){const s=SEC[k];let t=s.m*60,d=0,body;
const tick=()=>{$('#tm').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0)fin()};
if(k=='W')body='<textarea id=wr rows=14 placeholder="Câu 81 (≥150 chữ) và câu 82 (≥300 chữ)"></textarea><div id=cnt class=mu></div><button id=cp>Sao chép để nhờ Claude chấm</button>';
else body=(k=='L'?`<audio controls src="audio/${e.id}.mp3" style="width:100%"></audio><div class=mu>Nếu chưa có file trong thư mục audio/, chọn từ máy: <input type=file accept="audio/*" id=af></div>`:'')+[...e.ans[k]].map((_,i)=>{const n=s.n+i,c=k=='R'&&n>50&&n<61?6:4;return`<span style="display:inline-block;margin:3px">${n}.<select data-n=${n}><option>-</option>${L6.slice(0,c).split('').map(x=>`<option>${x}</option>`).join('')}</select></span>`}).join('');
M.innerHTML=`<div class=card><b id=tm></b> <button id=fn class=p>Nộp</button></div><div class=card>${body}</div><div id=rs></div>`;
if(k=='W'){$('#wr').oninput=x=>$('#cnt').textContent=(x.target.value.match(/[\u4e00-\u9fff]/g)||[]).length+' chữ';$('#cp').onclick=()=>{navigator.clipboard.writeText('Hãy chấm bài viết HSK6 này:\n'+$('#wr').value);toast('Đã sao chép')}}
if($('#af'))$('#af').onchange=x=>$('audio').src=URL.createObjectURL(x.target.files[0]);
function fin(){clearInterval(T);if(d++||k=='W')return;const a=e.ans[k];let c=0,w=[];
[...a].forEach((x,i)=>{const n=s.n+i,v=M.querySelector(`select[data-n="${n}"]`).value;v==x?c++:w.push(`${n}: ${v} → ${x}`)});
const p=Math.round(c/a.length*100);S.h.push({t:Date.now(),e:e.name,s:s.l,c,k:a.length,p});sv();
$('#rs').innerHTML=`<div class=card><h3 class="${p<60?'no':'ok'}">${c}/${a.length} ≈ ${p}/100</h3>${p<60?'<div class=no>Dưới 60 — chưa đạt phần này.</div>':''}<div class=mu>Câu sai (bạn chọn → đáp án): ${w.join(' · ')||'không có'}</div></div>`}
$('#fn').onclick=fin;T=setInterval(tick,1000);tick()}
</script></body></html>
